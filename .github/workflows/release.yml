name: Release

# Pushing a version tag (for example alpha-0.1.19) builds the Windows client from
# that commit and prepares a DRAFT release with the exe, the installer,
# version.json and checksums. Nothing reaches users until the draft is published
# by hand: clients look for version.json on the latest published release.

on:
  push:
    tags:
      - 'alpha-[0-9]*'

permissions:
  contents: write

jobs:
  windows:
    name: Build and draft release
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test
        run: go test ./...

      - name: Install NSIS (builds the installer)
        run: choco install nsis -y --no-progress

      # The "what's new" line the client shows once after updating comes from the
      # tag's own message:  git tag -a alpha-0.1.20 -m "One line for players"
      # A plain (lightweight) tag has no message, so the note is empty and the
      # client shows nothing. checkout leaves an annotated tag as a plain ref, so
      # fetch the tag object itself before reading it.
      - name: Read the release note from the tag
        shell: pwsh
        run: |
          git fetch --quiet --force origin "+refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          $note = ''
          if ((git cat-file -t "refs/tags/$env:TAG") -eq 'tag') {
            $note = (git tag -l --format='%(contents:subject)' $env:TAG | Out-String).Trim()
          }
          Write-Host "Release note: '$note'"
          "RELEASE_NOTE=$note" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exe, installer and version.json
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/codex-client.exe"
          ./scripts/build-codex.ps1 -Version $env:TAG -NoCgo -DownloadUrl $url -Notes "$env:RELEASE_NOTE"

      - name: Verify and write checksums
        shell: pwsh
        run: |
          foreach ($f in 'codex-client.exe', 'codex-client-setup.exe', 'version.json') {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          $manifest = Get-Content version.json -Raw | ConvertFrom-Json
          $sha = (Get-FileHash codex-client.exe -Algorithm SHA256).Hash.ToLower()
          if ($manifest.version -ne $env:TAG) { throw "version.json says $($manifest.version), tag is $env:TAG" }
          if ($manifest.sha256 -ne $sha) { throw "version.json checksum does not match codex-client.exe" }
          $lines = foreach ($f in 'codex-client.exe', 'codex-client-setup.exe') {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f"
          }
          [System.IO.File]::WriteAllText("$PWD\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG codex-client-setup.exe codex-client.exe version.json SHA256SUMS.txt `
            --repo "${{ github.repository }}" --draft --verify-tag --title "Codex Client $env:TAG" --generate-notes
